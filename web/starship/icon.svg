<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- OpenStarshipEarth icon: our faceted ship bursting through a golden ring over the Earth's limb, on a glossy tile -->
  <defs>
    <radialGradient id="space" cx="0.5" cy="0.25" r="0.95"><stop offset="0" stop-color="#3a53c8"/><stop offset="0.45" stop-color="#15226e"/><stop offset="1" stop-color="#040618"/></radialGradient>
    <linearGradient id="earth" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b8f2ff"/><stop offset="0.025" stop-color="#3fb2f2"/><stop offset="0.09" stop-color="#1667c8"/><stop offset="0.22" stop-color="#0a2f78"/><stop offset="1" stop-color="#062257"/></linearGradient>
    <radialGradient id="atmo" cx="0.5" cy="0.5" r="0.5"><stop offset="0.9" stop-color="#8fe6ff" stop-opacity="0.75"/><stop offset="1" stop-color="#8fe6ff" stop-opacity="0"/></radialGradient>
    <linearGradient id="land" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9af07a"/><stop offset="1" stop-color="#1f9a4a"/></linearGradient>
    <linearGradient id="hullL" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb873"/><stop offset="1" stop-color="#ff7300"/></linearGradient>
    <linearGradient id="hullR" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e56700"/><stop offset="1" stop-color="#8a3d00"/></linearGradient>
    <linearGradient id="wingA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#aaa0a0"/><stop offset="1" stop-color="#766b6b"/></linearGradient>
    <linearGradient id="wingB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6d6262"/><stop offset="1" stop-color="#3f3838"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2feff"/><stop offset="0.5" stop-color="#4fd6ff"/><stop offset="1" stop-color="#0a5fa8"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff7b0"/><stop offset="0.5" stop-color="#ffcf1a"/><stop offset="1" stop-color="#e07a00"/></linearGradient>
    <radialGradient id="flame" cx="0.5" cy="0.15" r="0.85"><stop offset="0" stop-color="#ffffff"/><stop offset="0.25" stop-color="#bff3ff"/><stop offset="0.6" stop-color="#3fb2ff"/><stop offset="1" stop-color="#2a5cff" stop-opacity="0"/></radialGradient>
    <radialGradient id="flare" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ffffff"/><stop offset="0.25" stop-color="#d8f6ff" stop-opacity="0.8"/><stop offset="1" stop-color="#8fd8ff" stop-opacity="0"/></radialGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.55"/><stop offset="1" stop-color="#fff" stop-opacity="0.04"/></linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="0.48" stop-color="#c8f4ff"/><stop offset="0.52" stop-color="#5ccaff"/><stop offset="1" stop-color="#1c6fe6"/></linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#020516" flood-opacity="0.6"/></filter>
    <filter id="tglow" x="-10%" y="-30%" width="120%" height="160%"><feDropShadow dx="0" dy="0" stdDeviation="9" flood-color="#39c3ff" flood-opacity="0.75"/></filter>
