    <g fill="#fff"><circle cx="150" cy="200" r="4"/><circle cx="250" cy="110" r="3"/><circle cx="860" cy="170" r="5"/><circle cx="920" cy="360" r="3"/><circle cx="110" cy="440" r="3"/><circle cx="720" cy="96" r="3"/><circle cx="600" cy="150" r="2.5"/><circle cx="190" cy="330" r="2.5"/><circle cx="900" cy="560" r="2.5"/><circle cx="430" cy="84" r="2"/></g>
    <circle cx="512" cy="1540" r="960" fill="url(#atmo)"/>
    <circle cx="512" cy="1560" r="900" fill="url(#earth)"/>
    <path d="M90 800 C 210 706 330 694 420 708 C 520 724 566 684 650 694 C 770 706 830 746 940 806 C 770 880 280 880 90 800 Z" fill="url(#land)" opacity="0.9"/>
    <path d="M40 760 C 250 640 770 640 990 760" fill="none" stroke="#e8fbff" stroke-width="5" opacity="0.7"/>
    <g fill="#fff" opacity="0.7"><ellipse cx="300" cy="750" rx="90" ry="14"/><ellipse cx="760" cy="770" rx="110" ry="15"/><ellipse cx="540" cy="842" rx="130" ry="13"/></g>
    <g stroke="#bfefff" stroke-width="6" stroke-linecap="round" opacity="0.55"><path d="M 230 880 L 300 760"/><path d="M 860 700 L 800 800"/><path d="M 140 640 L 190 560"/><path d="M 790 930 L 760 980"/></g>
    <use href="#ring" transform="translate(500 560) rotate(-22) scale(0.86)"/>
    <circle cx="512" cy="500" r="330" fill="url(#flare)" opacity="0.35"/>
    <use href="#ship" filter="url(#shadow)" transform="translate(520 470) rotate(-22) scale(1.18)"/>
    <circle cx="418" cy="162" r="120" fill="url(#flare)" opacity="0.85"/>
    <path d="M 32 32 H 992 V 330 C 760 440 270 440 32 330 Z" fill="url(#gloss)"/>
  </g>
  <rect x="38" y="38" width="948" height="948" rx="214" fill="none" stroke="#bfe9ff" stroke-opacity="0.55" stroke-width="10"/>
</svg>
