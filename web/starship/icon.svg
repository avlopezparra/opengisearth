      <path d="M -40 30 L -104 168 L -44 112 Z" fill="url(#wingB)" stroke="#0a1a44" stroke-width="5"/><path d="M 40 30 L 104 168 L 44 112 Z" fill="#0e3688" stroke="#0a1a44" stroke-width="5"/>
      <path d="M -30 -64 L -306 122 L -150 104 L -36 36 Z" fill="url(#wingA)" stroke="#0a1a44" stroke-width="5"/><path d="M -36 36 L -150 104 L -306 122 L -274 154 L -42 98 Z" fill="url(#wingB)" stroke="#0a1a44" stroke-width="5"/>
      <path d="M 30 -64 L 306 122 L 150 104 L 36 36 Z" fill="url(#wingB)" stroke="#0a1a44" stroke-width="5"/><path d="M 36 36 L 150 104 L 306 122 L 274 154 L 42 98 Z" fill="#0e3688" stroke="#0a1a44" stroke-width="5"/>
      <path d="M -306 122 L -330 6 L -276 116 Z" fill="url(#gold)" stroke="#0a1a44" stroke-width="5"/><path d="M 306 122 L 330 6 L 276 116 Z" fill="#e89a00" stroke="#0a1a44" stroke-width="5"/>
      <path d="M 0 -296 L -62 58 L -32 106 L 0 114 Z" fill="url(#hullL)" stroke="#0a1a44" stroke-width="5"/><path d="M 0 -296 L 62 58 L 32 106 L 0 114 Z" fill="url(#hullR)" stroke="#0a1a44" stroke-width="5"/>
      <path d="M 0 -296 L -20 -180 L 0 -170 Z" fill="#ffffff" opacity="0.9"/>
      <path d="M 0 -176 L -26 -74 L 0 -30 L 26 -74 Z" fill="url(#glass)" stroke="#0a1a44" stroke-width="5"/><path d="M -3 -160 L -19 -80 L -5 -56 Z" fill="#ffffff" opacity="0.75"/>
      <path d="M -24 106 L 24 106 L 16 126 L -16 126 Z" fill="#26324f" stroke="#0a1a44" stroke-width="4"/><ellipse cx="0" cy="124" rx="15" ry="7" fill="#dff8ff"/>
    </g>
    <g id="ring"><ellipse cx="0" cy="0" rx="270" ry="250" fill="none" stroke="#7a3d00" stroke-width="46"/><ellipse cx="0" cy="0" rx="270" ry="250" fill="none" stroke="url(#gold)" stroke-width="36"/><path d="M -236 -108 A 262 242 0 0 1 60 -240" fill="none" stroke="#fffbe0" stroke-width="9" stroke-linecap="round" opacity="0.85"/></g>
    <clipPath id="tile"><rect x="32" y="32" width="960" height="960" rx="220"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
