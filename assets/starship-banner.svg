<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 600" width="1600" height="600">
  <!-- OpenStarshipEarth banner: deep space, the Earth's limb, a squadron of ships and a bold retro title -->
  <defs>
    <radialGradient id="space" cx="0.7" cy="0.3" r="0.9"><stop offset="0" stop-color="#28306e"/><stop offset="0.55" stop-color="#0c1033"/><stop offset="1" stop-color="#03040f"/></radialGradient>
    <linearGradient id="earth" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6fd8ff"/><stop offset="0.2" stop-color="#1f7fd6"/><stop offset="1" stop-color="#071f4d"/></linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff59a"/><stop offset="0.45" stop-color="#ffc21a"/><stop offset="1" stop-color="#ff6a00"/></linearGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#8794ad"/></linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1e6fe0"/><stop offset="1" stop-color="#7fd4ff"/></linearGradient>
    <radialGradient id="flame" cx="0.5" cy="0.2" r="0.8"><stop offset="0" stop-color="#fff6c0"/><stop offset="0.4" stop-color="#ffb300"/><stop offset="1" stop-color="#ff3d00" stop-opacity="0"/></radialGradient>
    <radialGradient id="neb" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#b05cff" stop-opacity="0.45"/><stop offset="1" stop-color="#b05cff" stop-opacity="0"/></radialGradient>
    <g id="ship">
      <ellipse cx="0" cy="120" rx="24" ry="70" fill="url(#flame)"/>
      <path d="M -20 -40 L -180 80 L -162 98 L -24 54 Z" fill="url(#wing)" stroke="#0b1a3a" stroke-width="6" stroke-linejoin="round"/>
      <path d="M 20 -40 L 180 80 L 162 98 L 24 54 Z" fill="url(#wing)" stroke="#0b1a3a" stroke-width="6" stroke-linejoin="round"/>
      <path d="M -180 80 L -192 12 L -162 72 Z" fill="#ffd60a" stroke="#0b1a3a" stroke-width="5"/>
      <path d="M 180 80 L 192 12 L 162 72 Z" fill="#ffd60a" stroke="#0b1a3a" stroke-width="5"/>
      <path d="M 0 -168 L 38 42 L 18 60 L -18 60 L -38 42 Z" fill="url(#hull)" stroke="#0b1a3a" stroke-width="6" stroke-linejoin="round"/>
      <ellipse cx="0" cy="-54" rx="14" ry="38" fill="#7fe6ff" stroke="#0b1a3a" stroke-width="5"/>
    </g>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%"><feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#ff8a00" flood-opacity="0.6"/></filter>
  </defs>
  <rect width="1600" height="600" fill="url(#space)"/>
  <ellipse cx="1180" cy="200" rx="360" ry="140" fill="url(#neb)"/>
  <g fill="#fff">
    <circle cx="80" cy="60" r="2"/><circle cx="240" cy="140" r="1.5"/><circle cx="420" cy="40" r="2.5"/><circle cx="610" cy="120" r="1.5"/><circle cx="760" cy="60" r="2"/><circle cx="930" cy="30" r="1.5"/>
    <circle cx="1080" cy="110" r="2.5"/><circle cx="1260" cy="50" r="1.5"/><circle cx="1420" cy="140" r="2"/><circle cx="1540" cy="60" r="1.5"/><circle cx="1500" cy="300" r="2"/><circle cx="1350" cy="380" r="1.5"/>
    <circle cx="150" cy="330" r="1.5"/><circle cx="60" cy="230" r="2"/><circle cx="700" cy="300" r="1.5"/><circle cx="1000" cy="260" r="1.5"/>
  </g>
  <circle cx="800" cy="2050" r="1560" fill="#7fd4ff" opacity="0.35"/>
  <circle cx="800" cy="2070" r="1540" fill="url(#earth)"/>
  <path d="M0 560 C 200 520 380 540 560 515 C 760 490 900 520 1100 500 C 1300 482 1460 505 1600 520 L 1600 600 L 0 600 Z" fill="#3fbf5a" opacity="0.6"/>
  <use xlink:href="#ship" href="#ship" transform="translate(1250 320) rotate(55) scale(1.05)"/>
  <use xlink:href="#ship" href="#ship" transform="translate(1440 190) rotate(55) scale(0.6)"/>
  <use xlink:href="#ship" href="#ship" transform="translate(1060 170) rotate(55) scale(0.5)"/>
  <g filter="url(#glow)" font-family="Impact, 'Arial Black', 'Segoe UI', sans-serif" font-style="italic" font-weight="900">
    <text x="70" y="250" font-size="150" fill="#0b1a6b" stroke="#0b1a6b" stroke-width="26" stroke-linejoin="round" transform="skewX(-10)">OpenStarship</text>
    <text x="70" y="250" font-size="150" fill="url(#title)" stroke="#d81b1b" stroke-width="6" stroke-linejoin="round" transform="skewX(-10)">OpenStarship</text>
    <text x="150" y="380" font-size="120" fill="#0b1a6b" stroke="#0b1a6b" stroke-width="24" stroke-linejoin="round" transform="skewX(-10)">EARTH</text>
    <text x="150" y="380" font-size="120" fill="url(#title)" stroke="#d81b1b" stroke-width="6" stroke-linejoin="round" transform="skewX(-10)">EARTH</text>
  </g>
  <text x="84" y="450" font-family="'Segoe UI', Arial, sans-serif" font-size="30" font-weight="700" fill="#e8f4ff">Arcade flight over the real Earth · adventure · city races · bosses</text>
</svg>
