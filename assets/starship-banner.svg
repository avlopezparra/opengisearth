    <radialGradient id="space" cx="0.5" cy="0.25" r="0.95"><stop offset="0" stop-color="#3a53c8"/><stop offset="0.45" stop-color="#15226e"/><stop offset="1" stop-color="#040618"/></radialGradient>
    <linearGradient id="earth" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b8f2ff"/><stop offset="0.025" stop-color="#3fb2f2"/><stop offset="0.09" stop-color="#1667c8"/><stop offset="0.22" stop-color="#0a2f78"/><stop offset="1" stop-color="#062257"/></linearGradient>
    <radialGradient id="atmo" cx="0.5" cy="0.5" r="0.5"><stop offset="0.9" stop-color="#8fe6ff" stop-opacity="0.75"/><stop offset="1" stop-color="#8fe6ff" stop-opacity="0"/></radialGradient>
    <linearGradient id="land" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9af07a"/><stop offset="1" stop-color="#1f9a4a"/></linearGradient>
